# Build + tests on a GitHub Windows runner: no GPU and no game data, so the GPU tests skip
# (each prints "SKIPPED <test>: <reason>", counted at the end of scripts/test.ps1) and the
# tests on game data pass without running. What it checks on every push and pull request:
# the workspace builds, the unit / integration tests pass, and the recompiler's HLSL compiles
# with the runner's DXC (Windows SDK).
#
# Left out: the test title's end-to-end run (`test_title_runs_and_game_folder_is_untouched`).
# The runner has no System32\xgameruntime.dll (Gaming Services) and only the Microsoft Basic
# Render Driver (4-lane waves): the launcher warns about both, which that test treats as a
# failure. It still runs in `scripts/test.ps1` on a PC.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and test (Windows, no GPU)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable, MSVC)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build gate
        shell: pwsh
        run: |
          # A pull request is judged by the gate of its target branch, never by its own copy.
          # The gate is restored and the guard is armed only once the target branch has the gate:
          # the pull request that introduces it has nothing to restore from.
          $guard = @()
          $base = $env:GITHUB_BASE_REF
          if ($base) {
            git fetch --quiet --depth=1 origin $base
            git cat-file -e "origin/${base}:crates/xcl-gate/Cargo.toml" 2>$null
            if ($LASTEXITCODE -eq 0) {
              git fetch --quiet --unshallow origin 2>$null
              git checkout --quiet "origin/$base" -- crates/xcl-gate
              $guard = @('--base', "origin/$base", '--protect', 'crates/xcl-gate', '--protect', '.github/workflows', '--protect', '.github/CODEOWNERS')
            }
          }
          cargo run --quiet --release --manifest-path crates/xcl-gate/Cargo.toml -- --root . --config-file crates/xcl/src/config.rs --skip crates/xcl-gate --no-sync --limits scripts/gate-limits.txt @guard
      - name: Build and test
        shell: pwsh
        run: ./scripts/test.ps1 --nocapture --skip test_title_runs_and_game_folder_is_untouched
