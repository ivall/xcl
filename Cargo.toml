[workspace]
resolver = "2"
members = ["crates/xcl", "tests/testtitle", "tests/testgamedll"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

# Keep full symbols in optimized alpha builds so release-only crashes can be
# resolved to functions, files, and lines without a separate diagnostic build.
[profile.release]
debug = 2

# Keep optimized benchmark code while retaining names and line information for CPU profiles.
[profile.bench]
debug = 1
