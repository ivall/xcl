<!doctype html><html><head><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Figtree:wght@400&display=swap" rel="stylesheet"><style>
body{margin:0;background:var(--surface-account)}
.c{position:relative;width:960px;height:288px;overflow:hidden}
.a{fill:var(--surface-settings)}.b{fill:var(--surface-settings-light)}.k{fill:var(--prompt-ink)}.d{fill:var(--surface-calibration)}
.t{position:absolute;left:40px;bottom:30px;max-width:900px}
.n{font-family:var(--font-label);font-weight:700;font-size:64px;line-height:.95;color:var(--prompt-ink);text-transform:uppercase;margin:0}
.g{font-family:var(--font-hint);font-size:14px;line-height:20px;color:var(--hint-ink);margin:8px 0 0}
</style><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"></head><body><div class="c">
<svg width="960" height="120" viewBox="0 0 960 120" style="position:absolute;left:0;top:0">
<!-- blocks: surface-settings 600x120 slab, surface-settings-light 260x120 bleeding right, surface-calibration 100x120 strip (fills from tokens) -->
<!-- arrangement: top band of unequal bands, as the title's screens compose in horizontal footer strips -->
<!-- pattern: keycap tiles (geometric, modular: the system is keys as rounded squares of glyph-size), one tile two-wide like ENTER, one disc for the pad it replaces -->
<!-- steps: glyph-size 27 x2 = 54 tiles, item-gap 21; radii radius-keycap 6 x2 = 12, disc r = 27 -->
<rect class="d" x="0" y="0" width="100" height="120"/>
<rect class="a" x="100" y="0" width="600" height="120"/>
<rect class="b" x="700" y="0" width="260" height="120"/>
<rect class="k" x="460" y="33" width="54" height="54" rx="12"/>
<rect class="k" x="535" y="33" width="54" height="54" rx="12"/>
<rect class="k" x="610" y="33" width="129" height="54" rx="12"/>
<rect class="k" x="760" y="33" width="54" height="54" rx="12"/>
<circle class="k" cx="862" cy="60" r="27"/>
</svg>
<div class="t"><p class="n">XCL Controller Prompts</p><p class="g">Keyboard and mouse prompts drawn to the title's own prompt grid.</p></div>
</div></body></html>
